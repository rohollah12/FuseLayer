name: Project checks

on:
  push:
  pull_request:

jobs:
  lint-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: GenVM lint
        run: |
          genvm-lint check contracts/fuse_layer.py
          genvm-lint check contracts/demo_vault.py

  direct-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run direct tests
        run: pytest tests/direct/ -v

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install frontend dependencies
        run: npm install
      - name: Build Next.js app
        env:
          NEXT_PUBLIC_FUSELAYER_CONTRACT_ADDRESS: "0x1111111111111111111111111111111111111111"
          FUSELAYER_CONTRACT_ADDRESS: "0x1111111111111111111111111111111111111111"
        run: npm run build
